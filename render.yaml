services:
  - type: web
    name: urban-air-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m airassist
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ANTHROPIC_API_KEY
        sync: false
